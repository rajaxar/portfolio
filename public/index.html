<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/og/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/og/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f0e2" />

    <!--
      These are the front sheet's defaults. Every route overrides them at render
      time from src/lib/seo.js — and the prerender step (scripts/prerender.js)
      serialises the document after React has run, so what a crawler or a link
      preview receives is the route's own title, description, canonical and
      share card rather than this block.
    -->
    <title>Raj Shah</title>
    <meta
      name="description"
      content="Whether NBA players really play better in their contract year, and who gets voted out on Survivor — long-form data pieces by Raj Shah."
    />
    <link rel="canonical" href="https://rajshah.me/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Raj Shah" />
    <meta property="og:title" content="Raj Shah" />
    <meta
      property="og:description"
      content="Whether NBA players really play better in their contract year, and who gets voted out on Survivor — long-form data pieces by Raj Shah."
    />
    <meta property="og:url" content="https://rajshah.me/" />
    <meta property="og:image" content="https://rajshah.me/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raj Shah" />
    <meta
      name="twitter:description"
      content="Whether NBA players really play better in their contract year, and who gets voted out on Survivor — long-form data pieces by Raj Shah."
    />
    <meta name="twitter:image" content="https://rajshah.me/og/home.png" />

    <script type="application/ld+json" data-seo="jsonld">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Raj Shah",
        "url": "https://rajshah.me/",
        "jobTitle": "Data Scientist",
        "sameAs": ["https://www.linkedin.com/in/raj-v-shah/"]
      }
    </script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <noscript>
      Raj Shah. The stories draw themselves with
      JavaScript; the writing is in the page source either way.
    </noscript>
    <div id="root"></div>
  </body>
</html>
